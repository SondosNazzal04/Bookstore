<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<div id="main-div">
		Hello
	</div>
	<br>
	<br>
	<div id="control-center">
		<button id="bold">Bold</button>
		<button id="italic">Italic</button>
		<button id="left">Left</button>
		<button id="center">Center</button>
		<button id="right">Right</button>
		<button id="uppercase">Uppercase</button>
		<button id="lowercase">Lowercase</button>
		<button id="capitalize">Capitalize</button>
		<br>
		<br>
		<label for="text-color">Text color:</label>
		<input type="text" id="text-color" style="font-style: italic;">
		<label for="background-color">Background color:</label>
		<input type="text" id="background-color">
		<label for="font-size">Font size:</label>
		<input type="number" name="" id="font-size">
		<label for="font">Font:</label>
		<select name="" id="font">
			<option value="Georgia">Georgia</option>
			<option value="Arial">Arial</option>
			<option value="Times New Roman">Times New Roman</option>
			<option value="Impact">Impact</option>
			<option value="monospace">monospace</option>
			<option value="Tahoma">Tahoma</option>
			<option value="Calibri">Calibri</option>
		</select>
	</div>
	<script src="./app.js"></script>
</body>
</html>
